# Publishing, from the public repository.
#
# It runs here rather than in the monorepo for one reason that turns out to
# decide several: npm attests provenance against a *public* repository, and the
# monorepo is private. Publishing from there would mean no attestation, a
# "Repository" link on both package pages that 404s for everyone who clicks it,
# and SourceLink pointing consumers at sources they cannot fetch. From here all
# three work, and the packages point at the code they were built from.
#
# NuGet is published by **trusted publishing**: no API key is stored anywhere.
# The job proves it is this workflow in this repository with an OIDC token, and
# nuget.org exchanges that for a key valid one hour and usable once. What is left
# in the secrets is `NUGET_USER`, a profile name that is not a credential. The
# policy that trusts this is configured on nuget.org and names the repository
# owner, the repository, and this file by name — so renaming this file breaks
# publishing until the policy is updated, which is the intended tradeoff.
#
# npm publishes the same way since `0.1.0` went out: npm configures a trusted
# publisher on the package's own settings page, which needs the package to
# exist, so the first release used a token and this one does not. No long-lived
# publishing credential is left in either registry's path, and provenance is
# generated without asking — it is what a trusted publish means.
#
# Like the monorepo's own CI, this file is authored at
# `sdks/.github/workflows/release.yml` in the private tree and arrives at the
# mirror's root through `sync-sdk-mirror.sh`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: the tag agrees with the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A package published as 0.1.0 from a tree that says 0.2.0 is a mistake
      # with no undo: a version, once taken on a public registry, is taken. So
      # this runs before anything is built, not as part of publishing.
      - name: version in the tag, the csproj and package.json is one version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          csproj=$(sed -n 's|^[[:space:]]*<Version>\([^<]*\)</Version>.*|\1|p' \
                   csharp/Talos.Sdk/Talos.Sdk.csproj)
          npm=$(node -p "require('./node/package.json').version")
          echo "tag=$tag csproj=$csproj npm=$npm"
          if [ "$tag" != "$csproj" ] || [ "$tag" != "$npm" ]; then
            echo "::error::the tag says $tag, the csproj says $csproj and package.json says $npm." >&2
            echo "Bump the manifests in the monorepo, re-sync, and tag that; a published version cannot be recalled." >&2
            exit 1
          fi
          # `node/src/version.ts` is the third copy, and it is what the SDK
          # reports to the server — held to package.json by the Node suite,
          # which runs below before anything is published.

  nuget:
    name: NuGet
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token this job trades for a publishing key. Without it the
      # exchange fails in a way that reads like a login problem.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: the setting this job needs exists
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "${NUGET_USER}" ]; then
            echo "::error::NUGET_USER is not set. Add your nuget.org profile name — the username, not the email — as a repository secret, and create a trusted publishing policy on nuget.org for antondziuin/talos-sdk, workflow file release.yml." >&2
            exit 1
          fi
      - run: dotnet test csharp/Talos.Sdk.Tests/Talos.Sdk.Tests.csproj -c Release
      - run: dotnet pack csharp/Talos.Sdk/Talos.Sdk.csproj -c Release -o nupkg
      - name: the package carries both frameworks, its README, symbols and a licence
        run: |
          unzip -l nupkg/Talos.Sdk.*.nupkg > listing
          for want in lib/net8.0/Talos.Sdk.dll lib/netstandard2.0/Talos.Sdk.dll README.md; do
            grep -q "$want" listing || { echo "the package is missing $want" >&2; exit 1; }
          done
          ls nupkg/*.snupkg > /dev/null || { echo "no symbol package was produced" >&2; exit 1; }
          unzip -p nupkg/Talos.Sdk.*.nupkg Talos.Sdk.nuspec | grep -q '<license type="expression">MIT</license>' \
            || { echo "the package does not declare the MIT licence" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ github.ref_name }}
          path: nupkg/*
      # Minted immediately before the push, and not a step earlier: the key
      # nuget.org returns lives one hour and the token buying it works once.
      - name: exchange this run's identity for a one-hour key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # The `.snupkg` beside it goes up automatically: NuGet pushes the symbol
      # package that shares a name with the package being pushed.
      - name: push to nuget.org
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  npm:
    name: npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance is an attestation signed with a short-lived OIDC token minted
      # for this run. Without this permission `--provenance` fails, and the
      # failure reads like an authentication problem.
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      # Node 24 rather than the 22 the CI job tests on, and not by preference:
      # a trusted publish needs npm 11.5.1, and Node 22 still ships npm 10. No
      # `cache:` input anywhere here on purpose — a release build should fetch
      # what the lockfile says rather than what a cache kept.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm is new enough to publish without a token
        run: |
          set -euo pipefail
          have=$(npm --version)
          echo "npm $have"
          # Without OIDC support npm falls back to looking for a token it will
          # not find, and says `ENEEDAUTH` — which reads like a missing secret
          # rather than a runner image that moved backwards.
          # `sort -V -C` succeeds only when its input is already in version
          # order, so this asks whether 11.5.1 comes first.
          { echo 11.5.1; echo "$have"; } | sort -V -C || { echo "::error::npm $have cannot do a trusted publish; 11.5.1 or later is required." >&2; exit 1; }
      - run: npm install --no-audit --no-fund
      # This is where `src/version.ts` is held to package.json, so it runs
      # before the publish rather than beside it.
      - run: npm test
      - run: npm run build
      - run: npm pack --pack-destination .
      - name: the tarball carries the built package and nothing else
        run: |
          tar -tzf antondziuin-talos-sdk-*.tgz > listing
          for want in package/dist/index.js package/dist/index.cjs package/dist/index.d.ts \
                      package/README.md package/LICENSE; do
            grep -q "^$want$" listing || { echo "the tarball is missing $want" >&2; exit 1; }
          done
          for unwanted in package/src/ package/test/; do
            if grep -q "^$unwanted" listing; then
              echo "the tarball ships $unwanted, which belongs to the repository and not to a customer" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball-${{ github.ref_name }}
          path: node/antondziuin-talos-sdk-*.tgz
      # `--access public`: the package is scoped, and npm makes scoped packages
      # private by default — which on a free account is a publish that fails
      # rather than a package nobody can see.
      # No NODE_AUTH_TOKEN: the OIDC token this job already has permission to
      # mint is what npm trades for the right to publish, against the trusted
      # publisher configured on the package — this repository, this workflow
      # file. Renaming this file stops npm publishing too, the same way it
      # stops NuGet.
      - name: publish to npmjs.com
        run: |
          set -euo pipefail
          # The NuGet half pushes with `--skip-duplicate`; npm has no such flag,
          # and publishing a version that exists is a hard error. The two halves
          # run in parallel, so without this the first failure of either one
          # leaves a release that cannot be retried: the fixed re-run dies here
          # on the version the successful half already published, and the only
          # way forward is to burn a version number nobody consumed.
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
            echo "$name@$version is already on the registry; nothing to publish"
            exit 0
          fi
          # `--provenance` is gone because a trusted publish attests on its own;
          # passing it is not an error, but it would suggest the attestation is
          # the flag's doing rather than the publish's.
          npm publish --access public
