# CI for the public SDK repository.
#
# This file lives at `sdks/.github/workflows/ci.yml` in the private monorepo,
# where GitHub ignores it — workflows only run from a repository's root — and
# arrives at `.github/workflows/ci.yml` in the mirror, which is its root. So the
# mirror's CI is written, reviewed and versioned beside the code it tests
# instead of drifting in a repository nobody opens.
#
# What it does NOT do is test against a live server: the contract harness needs
# the Rust server and a Postgres, both of which stay private. Those cases
# self-skip here and run in the monorepo on every push, which is where a wire
# disagreement has to be caught anyway.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  csharp:
    name: C# SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test csharp/Talos.Sdk.Tests/Talos.Sdk.Tests.csproj -c Release
      # The trim/AOT analyzers only mean something if a warning fails something.
      # They are what keeps the SDK reflection-free: a reflective serializer call
      # coming back would otherwise ship and send `{}` from a trimmed app.
      - run: dotnet build csharp/Talos.Sdk/Talos.Sdk.csproj -c Release -warnaserror

  node:
    name: Node SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Zero runtime dependencies is a promise this SDK's README makes, and one
      # nothing enforced: an `npm install` of anything at all would keep every
      # test green while the package a customer installs grew a supply chain.
      - name: the SDK ships with no runtime dependencies
        run: |
          node -e "const d=Object.keys(require('./package.json').dependencies||{});
                   if (d.length) { console.error('runtime dependencies found: '+d.join(', ')); process.exit(1) }"

  rust:
    name: Rust SDK (${{ matrix.os }})
    # All three, because the fingerprint probes are three different pieces of
    # platform code — registry and Win32 calls, sysfs, sysctl and getifaddrs —
    # and a Linux runner compiles exactly one of them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Without the built-in transport, which is how an application bringing
      # its own HTTP client builds it.
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  rust-msrv:
    name: Rust SDK (MSRV)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      # The `rust-version` the manifest promises. A newer API slipping in is
      # otherwise discovered by a customer on an older toolchain.
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo build --locked
      # What `cargo publish` would upload: the library and nothing else. The
      # tests read `../contract-vectors.json`, which exists here and not in a
      # package, so they are deliberately left out of it.
      - name: the package carries the library, its README and licence
        run: |
          cargo package --list --allow-dirty > listing
          for want in src/lib.rs README.md LICENSE Cargo.toml; do
            grep -qx "$want" listing || { echo "the package is missing $want" >&2; exit 1; }
          done
          if grep -q "^tests/" listing; then
            echo "the package ships tests/, which read files outside the crate" >&2
            exit 1
          fi
