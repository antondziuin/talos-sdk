# Publishing, from the public repository.
#
# It runs here rather than in the monorepo for one reason that turns out to
# decide several: npm attests provenance against a *public* repository, and the
# monorepo is private. Publishing from there would mean no attestation, a
# "Repository" link on both package pages that 404s for everyone who clicks it,
# and SourceLink pointing consumers at sources they cannot fetch. From here all
# three work, and the packages point at the code they were built from.
#
# **A release is a version bump, and nothing else.** Every push to `main` — which
# is what the monorepo's sync workflow does whenever its CI goes green — runs
# `plan`, which asks each registry whether the version in that package's
# manifest is already there. Usually both are, and both publish jobs skip in
# seconds. When one is not, that package is tested, packed and published, and
# the other is left alone: bumping `node/package.json` releases to npm without
# touching NuGet.
#
# It used to be a tag `v*` that had to equal both manifests. That made every
# release a joint one — a Node-only fix could not go out without a C# version
# nobody had changed — and it made the tag a fourth place the version could be
# wrong. The tags are still made, by the `tag` job, but *after* a publish
# succeeds: they record what went out instead of requesting it, which is also
# why a release that fails its tests and is fixed in a later commit no longer
# leaves a tag on a commit nothing was published from.
#
# NuGet is published by **trusted publishing**: no API key is stored anywhere.
# The job proves it is this workflow in this repository with an OIDC token, and
# nuget.org exchanges that for a key valid one hour and usable once. What is left
# in the secrets is `NUGET_USER`, a profile name that is not a credential. The
# policy that trusts this is configured on nuget.org and names the repository
# owner, the repository, and this file by name — so renaming this file breaks
# publishing until the policy is updated, which is the intended tradeoff. What
# the policy does *not* name is the event, which is why moving this workflow
# from a tag push to a branch push changed nothing about either registry's trust.
#
# npm publishes the same way since `0.1.0` went out: npm configures a trusted
# publisher on the package's own settings page, which needs the package to
# exist, so the first release used a token and this one does not. No long-lived
# publishing credential is left in either registry's path, and provenance is
# generated without asking — it is what a trusted publish means.
#
# Like the monorepo's own CI, this file is authored at
# `sdks/.github/workflows/release.yml` in the private tree and arrives at the
# mirror's root through `sync-sdk-mirror.sh`.
name: release

on:
  push:
    branches: [main]
  # For the case where a publish failed on something outside the code — a
  # registry outage, a policy that expired — and the fix is to run it again
  # rather than to bump a version nobody consumed.
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in quick succession would otherwise both see the same unpublished
# version and both try to publish it. NuGet absorbs that with `--skip-duplicate`
# and npm treats it as a hard error, so they are serialised — and never
# cancelled, because a run interrupted between the publish and the tag leaves a
# released version that nothing in this repository records.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: what the registries are missing
    runs-on: ubuntu-latest
    outputs:
      npm_version: ${{ steps.plan.outputs.npm_version }}
      npm_published: ${{ steps.plan.outputs.npm_published }}
      nuget_version: ${{ steps.plan.outputs.nuget_version }}
      nuget_published: ${{ steps.plan.outputs.nuget_published }}
    steps:
      - uses: actions/checkout@v4
      # `release-plan.sh` prints `key=value`, which is the format `$GITHUB_OUTPUT`
      # reads, so there is nothing here to parse and nothing to keep in step with
      # the script. It is the same file the monorepo's sync workflow runs.
      - id: plan
        run: bash ./release-plan.sh | tee -a "$GITHUB_OUTPUT"
      - name: say so in the run summary
        run: |
          set -euo pipefail
          say() {  # package, version, published
            if [ "$3" = "true" ]; then
              echo "- **$1** $2 — already on the registry, nothing to do"
            else
              echo "- **$1** $2 — **publishing**"
            fi
          }
          {
            echo "### Release plan"
            say npm "${{ steps.plan.outputs.npm_version }}" "${{ steps.plan.outputs.npm_published }}"
            say NuGet "${{ steps.plan.outputs.nuget_version }}" "${{ steps.plan.outputs.nuget_published }}"
          } >> "$GITHUB_STEP_SUMMARY"

  nuget:
    name: NuGet
    needs: plan
    if: needs.plan.outputs.nuget_published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token this job trades for a publishing key. Without it the
      # exchange fails in a way that reads like a login problem.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: the setting this job needs exists
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "${NUGET_USER}" ]; then
            echo "::error::NUGET_USER is not set. Add your nuget.org profile name — the username, not the email — as a repository secret, and create a trusted publishing policy on nuget.org for antondziuin/talos-sdk, workflow file release.yml." >&2
            exit 1
          fi
      - run: dotnet test csharp/Talos.Sdk.Tests/Talos.Sdk.Tests.csproj -c Release
      - run: dotnet pack csharp/Talos.Sdk/Talos.Sdk.csproj -c Release -o nupkg
      # The package carries the version `plan` looked up, and this is not the
      # same file read twice: a `Directory.Build.props`, a stray `-p:Version=`
      # or a version suffix would move one and not the other, and the first
      # anyone would know of it is a registry holding a version nothing asked
      # for — which cannot be taken back.
      - name: the package is the version this release is for
        run: |
          set -euo pipefail
          want="${{ needs.plan.outputs.nuget_version }}"
          test -f "nupkg/Talos.Sdk.$want.nupkg" || {
            echo "::error::expected nupkg/Talos.Sdk.$want.nupkg, but the pack produced $(ls nupkg/*.nupkg)" >&2
            exit 1
          }
      - name: the package carries both frameworks, its README, symbols and a licence
        run: |
          unzip -l nupkg/Talos.Sdk.*.nupkg > listing
          for want in lib/net8.0/Talos.Sdk.dll lib/netstandard2.0/Talos.Sdk.dll README.md; do
            grep -q "$want" listing || { echo "the package is missing $want" >&2; exit 1; }
          done
          ls nupkg/*.snupkg > /dev/null || { echo "no symbol package was produced" >&2; exit 1; }
          unzip -p nupkg/Talos.Sdk.*.nupkg Talos.Sdk.nuspec | grep -q '<license type="expression">MIT</license>' \
            || { echo "the package does not declare the MIT licence" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ needs.plan.outputs.nuget_version }}
          path: nupkg/*
      # Minted immediately before the push, and not a step earlier: the key
      # nuget.org returns lives one hour and the token buying it works once.
      - name: exchange this run's identity for a one-hour key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # The `.snupkg` beside it goes up automatically: NuGet pushes the symbol
      # package that shares a name with the package being pushed.
      - name: push to nuget.org
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  npm:
    name: npm
    needs: plan
    if: needs.plan.outputs.npm_published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance is an attestation signed with a short-lived OIDC token minted
      # for this run. Without this permission the publish cannot attest, and the
      # failure reads like an authentication problem.
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      # Node 24 rather than the 22 the CI job tests on, and not by preference:
      # a trusted publish needs npm 11.5.1, and Node 22 still ships npm 10. No
      # `cache:` input anywhere here on purpose — a release build should fetch
      # what the lockfile says rather than what a cache kept.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm is new enough to publish without a token
        run: |
          set -euo pipefail
          have=$(npm --version)
          echo "npm $have"
          # Without OIDC support npm falls back to looking for a token it will
          # not find, and says `ENEEDAUTH` — which reads like a missing secret
          # rather than a runner image that moved backwards.
          # `sort -V -C` succeeds only when its input is already in version
          # order, so this asks whether 11.5.1 comes first.
          { echo 11.5.1; echo "$have"; } | sort -V -C || { echo "::error::npm $have cannot do a trusted publish; 11.5.1 or later is required." >&2; exit 1; }
      - run: npm install --no-audit --no-fund
      # This is where `src/version.ts` is held to package.json, so it runs
      # before the publish rather than beside it.
      - run: npm test
      - run: npm run build
      - run: npm pack --pack-destination .
      - name: the tarball carries the built package and nothing else
        run: |
          tar -tzf antondziuin-talos-sdk-*.tgz > listing
          for want in package/dist/index.js package/dist/index.cjs package/dist/index.d.ts \
                      package/README.md package/LICENSE; do
            grep -q "^$want$" listing || { echo "the tarball is missing $want" >&2; exit 1; }
          done
          for unwanted in package/src/ package/test/; do
            if grep -q "^$unwanted" listing; then
              echo "the tarball ships $unwanted, which belongs to the repository and not to a customer" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball-${{ needs.plan.outputs.npm_version }}
          path: node/antondziuin-talos-sdk-*.tgz
      # `--access public`: the package is scoped, and npm makes scoped packages
      # private by default — which on a free account is a publish that fails
      # rather than a package nobody can see.
      # No NODE_AUTH_TOKEN: the OIDC token this job already has permission to
      # mint is what npm trades for the right to publish, against the trusted
      # publisher configured on the package — this repository, this workflow
      # file. Renaming this file stops npm publishing too, the same way it
      # stops NuGet.
      - name: publish to npmjs.com
        run: |
          set -euo pipefail
          # `plan` asked this same question several minutes ago, and the answer
          # can have changed since: `concurrency` serialises this run against
          # other runs, and against nothing else — not a `npm publish` from a
          # laptop, not a retried run of an older commit. NuGet's half rides
          # `--skip-duplicate`; npm has no such flag and a version that exists
          # is a hard error, so the question is asked once more here.
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
            echo "$name@$version is already on the registry; nothing to publish"
            exit 0
          fi
          # `--provenance` is gone because a trusted publish attests on its own;
          # passing it is not an error, but it would suggest the attestation is
          # the flag's doing rather than the publish's.
          npm publish --access public

  tag:
    name: tag what went out
    needs: [plan, npm, nuget]
    # `always()`, because the ordinary release is one of those two jobs being
    # skipped and the other publishing: without it this job would be skipped
    # along with them and a real release would go untagged. The conditions
    # inside decide per package, and a job that *failed* is not `success` and
    # so is not tagged.
    if: always() && (needs.npm.result == 'success' || needs.nuget.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # One tag per package rather than one per release: the two versions move
      # independently now, and a shared `v0.2.0` would be a claim about a
      # package that was not part of this release.
      #
      # Pushed with the workflow's own token, which by design starts no further
      # runs — and this workflow listens only to `main` in any case, so a tag
      # could not start one here even from a credential that does.
      - name: node-vX and csharp-vX, on the commit that was published
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag_it() {  # package, version
            local tag="$1-v$2"
            # A tag that is already here means this version was released from
            # some other commit. Moving it would erase the record of which one.
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists; leaving it where it is"
              return 0
            fi
            git tag -a "$tag" -m "$1 SDK $2"
            git push origin "$tag"
            echo "- \`$tag\` at $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "${{ needs.npm.result }}" = "success" ]; then
            tag_it node "${{ needs.plan.outputs.npm_version }}"
          fi
          if [ "${{ needs.nuget.result }}" = "success" ]; then
            tag_it csharp "${{ needs.plan.outputs.nuget_version }}"
          fi
